[project]
name = "reference-store"
version = "0.2.0"
description = "A place to store various references and useful content"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<0.166.0",
    "filelock>=4.0.0,<5.0.0",
    "mcp>=2.0.0,<3.0.0",
    "pillow>=13.0.0,<14.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "segno>=1.6.6,<2.0.0",
    "typer>=0.16.0,<0.30.0",
    "uvicorn>=0.31.1,<0.55.0",
]

[project.urls]
Repository = "https://github.com/DavidKoleczek/reference-store"

[project.scripts]
reference-store = "reference_store.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reference_store"

[tool.uv]
add-bounds = "major"
default-groups = "all"
exclude-newer = "5 days"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["reference", "./app"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # ruff
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT",  # flake-pytest-style
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501", # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = ["reference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib -n auto --maxprocesses 8"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
    "ty>=0.0.107",
]
