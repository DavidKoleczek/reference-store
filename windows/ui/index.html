<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'"
    />
    <title>Reference Store Setup</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="bar">
      <span class="wordmark">Reference Store<span class="square" aria-hidden="true"></span></span>
      <span class="version" id="version"></span>
    </header>

    <form id="choices" class="view" hidden>
      <main>
        <h1>Set up Reference Store</h1>
        <p class="lead" id="lead" hidden></p>

        <section id="store-group">
          <label class="label" for="store">Choose your first store location</label>
          <div class="row">
            <input id="store" class="field" type="text" spellcheck="false" autocomplete="off" />
            <button id="browse" class="button secondary" type="button">Browse</button>
          </div>
        </section>
        <p class="hint" id="stores-kept" hidden>Your stores stay as they are.</p>

        <section class="switches">
          <label class="switch">
            <input id="lan" type="checkbox" role="switch" />
            <span class="track"><span class="thumb"></span></span>
            <span class="text">
              Available on local network
              <small>Lets a phone open the app. It is plain HTTP, so only on a network you trust.</small>
            </span>
          </label>
          <label class="switch">
            <input id="desktop-shortcut" type="checkbox" role="switch" />
            <span class="track"><span class="thumb"></span></span>
            <span class="text">Desktop shortcut</span>
          </label>
          <label class="switch">
            <input id="start-menu-shortcut" type="checkbox" role="switch" />
            <span class="track"><span class="thumb"></span></span>
            <span class="text">Start menu shortcut</span>
          </label>
          <label class="switch">
            <input id="start-at-sign-in" type="checkbox" role="switch" />
            <span class="track"><span class="thumb"></span></span>
            <span class="text">Start when I sign in</span>
          </label>
          <label class="switch">
            <input id="skill" type="checkbox" role="switch" />
            <span class="track"><span class="thumb"></span></span>
            <span class="text">
              Agent Skill
              <small>Teaches your agents to save and find references. You choose which agents next.</small>
            </span>
          </label>
        </section>
      </main>
      <footer>
        <button id="install" class="button primary" type="submit">Install</button>
      </footer>
    </form>

    <form id="agents-view" class="view" hidden>
      <main>
        <h1>Which agent(s) to install the skill to?</h1>
        <p class="loading" id="agents-loading">
          <span class="working" aria-hidden="true"></span>
          <span id="agents-loading-text">Finding your agents...</span>
        </p>
        <p id="agents-failure" class="notice danger" role="alert" hidden></p>
        <div id="agents-chosen" hidden>
          <section class="agents" aria-label="Agents">
            <input
              id="filter"
              class="filter"
              type="text"
              placeholder="Filter agents"
              aria-label="Filter agents"
              spellcheck="false"
              autocomplete="off"
            />
            <div id="agent-list" class="agent-list"></div>
          </section>
          <section class="method" id="method">
            <span class="label" id="method-label">Method</span>
            <div class="segmented" role="group" aria-labelledby="method-label">
              <button type="button" data-mode="symlink" aria-pressed="true">Symlink (Recommended)</button>
              <button type="button" data-mode="copy" aria-pressed="false">Copy</button>
            </div>
            <p class="hint" id="method-hint"></p>
          </section>
        </div>
      </main>
      <footer>
        <button id="agents-back" class="button secondary" type="button">Back</button>
        <button id="agents-install" class="button primary" type="submit">Install</button>
      </footer>
    </form>

    <div id="progress" class="view" hidden>
      <main>
        <h1 id="progress-title">Installing</h1>
        <p class="lead" id="progress-lead" hidden></p>
        <ol id="steps" class="steps"></ol>
        <p id="failure" class="notice danger" role="alert" hidden></p>
      </main>
      <footer>
        <button id="close" class="button secondary" type="button" hidden>Close</button>
        <button id="back" class="button primary" type="button" hidden>Back</button>
        <button id="open" class="button primary" type="button" hidden>Open Reference Store</button>
      </footer>
    </div>

    <template id="step">
      <li class="step">
        <span class="state">
          <span class="working" aria-hidden="true"></span>
          <svg class="done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
          <svg class="noted" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          <svg class="failed" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4l9 16H3zM12 10v5M12 17.5v.5" />
          </svg>
        </span>
        <span class="label"></span>
      </li>
    </template>

    <template id="agent">
      <label class="agent">
        <input type="checkbox" />
        <span class="box">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
        </span>
        <span class="who"><span class="name"></span><span class="path"></span></span>
        <span class="tag"></span>
        <span class="also" hidden></span>
      </label>
    </template>

    <script src="setup.js"></script>
  </body>
</html>
